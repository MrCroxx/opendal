name: 3FS runner probe
on:
  push:
    branches: [codex/hf3fs-runner-probe]
permissions:
  contents: read
jobs:
  single-node:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and enable SoftRoCE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" rdma-core ibverbs-utils \
            cmake ninja-build libuv1-dev liblz4-dev liblzma-dev libdouble-conversion-dev \
            libdwarf-dev libunwind-dev libaio-dev libgflags-dev libgoogle-glog-dev \
            libgtest-dev libgmock-dev clang-14 clang-format-14 lld-14 libgoogle-perftools-dev \
            libssl-dev gcc-12 g++-12 libboost-all-dev meson libibverbs-dev libnuma-dev \
            libevent-dev libfmt-dev autoconf automake libtool gettext fuse3
          sudo modprobe rdma_rxe
          device=$(ip -4 route show default | awk 'NR == 1 {print $5}')
          sudo rdma link add opendal_rxe type rxe netdev "$device"
          ibv_devinfo -d opendal_rxe
          curl -fL --retry 3 -o /tmp/fdb.deb https://github.com/apple/foundationdb/releases/download/7.1.61/foundationdb-clients_7.1.61-1_amd64.deb
          sudo dpkg -i /tmp/fdb.deb
          curl -fL --retry 3 -o /tmp/fdbserver https://github.com/apple/foundationdb/releases/download/7.1.61/fdbserver.x86_64
          chmod +x /tmp/fdbserver
          sudo install /tmp/fdbserver /usr/local/bin/fdbserver
          git clone -q --depth 1 --branch fuse-3.16.2 https://github.com/libfuse/libfuse.git /tmp/libfuse
          meson setup /tmp/libfuse/build /tmp/libfuse -Dexamples=false -Dtests=false
          ninja -C /tmp/libfuse/build
          sudo ninja -C /tmp/libfuse/build install
          sudo ldconfig
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: /home/runner/work/_temp/3fs
          key: hf3fs-22fca045-ubuntu22-v1-${{ github.run_id }}
          restore-keys: hf3fs-22fca045-ubuntu22-v1-
      - name: Build 3FS
        id: build
        run: |
          if [ ! -d "$RUNNER_TEMP/3fs/.git" ]; then
            git clone -q https://github.com/deepseek-ai/3FS.git "$RUNNER_TEMP/3fs"
            git -C "$RUNNER_TEMP/3fs" checkout 22fca04564c7cc230fd8b9523b8b92864e1dad47
          fi
          cd "$RUNNER_TEMP/3fs"
          git submodule update --init --recursive --depth 1 --jobs 4
          ./patches/apply.sh
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE='-O1 -DNDEBUG' \
            -DCMAKE_CXX_FLAGS_RELEASE='-O1 -DNDEBUG' -DSHUFFLE_METHOD=g++11
          cmake --build build -j 3 --target mgmtd_main meta_main storage_main hf3fs_fuse_main admin_cli hf3fs_api_shared
      - uses: actions/cache/save@v4
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: /home/runner/work/_temp/3fs
          key: hf3fs-22fca045-ubuntu22-v1-${{ github.run_id }}
      - name: Start single-replica 3FS and test USRBIO
        timeout-minutes: 20
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          bash ./probe.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3fs-logs
          path: |
            /tmp/opendal-3fs-cluster/log
            /tmp/opendal-3fs-cluster.stdout
            /home/runner/work/_temp/3fs/build/CMakeFiles/CMakeError.log
      - name: Cleanup
        if: always()
        run: sudo rdma link delete opendal_rxe 2>/dev/null || true
