name: 3FS runner probe
on:
  push:
    branches: [codex/hf3fs-runner-probe]
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/3fs
          key: hf3fs-22fca045-ubuntu22-v1-40278912451
          fail-on-cache-miss: true
      - uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/3fs
          key: hf3fs-ubuntu22-${{ hashFiles('.github/services/hf3fs/single_node/setup.sh') }}
  behavior:
    needs: cache
    uses: ./.github/workflows/test_behavior_core.yml
    with:
      os: ubuntu-22.04
      cases: '[{"service":"hf3fs","feature":"services-hf3fs","setups":["single_node"]}]'
